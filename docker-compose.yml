services:
  yololizer:
    build: .
    ports:
      - "8001:8000"
    volumes:
      # Persist training data, labels, uploads, and model runs on the host
      - ./data:/app/data
      - ./runs:/app/runs
      # Live code from host (same UI/API as git — no rebuild for HTML/parcel changes)
      - ./frontend:/app/frontend
      - ./backend:/app/backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    # Pass through GPU if available (requires nvidia-container-toolkit)
    # Uncomment the lines below to enable GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
